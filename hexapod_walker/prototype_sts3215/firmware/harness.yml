cables:
  W_TRUNK_LIPO:
    gauge: 12 AWG
    length: 0.15
    colors:
    - RD
    - BK
    notes: silicone XT60 pigtail
  W_TRUNK_VPLUS:
    gauge: 12 AWG
    length: 0.1
    colors:
    - RD
    notes: switch → main fuse (V+ only)
  W_TRUNK_FUSED:
    gauge: 12 AWG
    length: 0.1
    colors:
    - RD
    notes: fused V+ trunk into the V+ trunk Wago
  W_TRUNK_GND:
    gauge: 12 AWG
    length: 0.2
    colors:
    - BK
    notes: trunk GND, switch → GND trunk Wago
  W_UNOQ_TAP:
    gauge: 20 AWG
    length: 0.25
    colors:
    - RD
    - BK
    notes: Uno Q own battery tap (share ground only; no buck)
  W_USB:
    category: bundle
    length: 0.3
    colors:
    - BK
    notes: USB-C-to-C via OTG hub (Uno Q is USB host)
  W_BUS_HEAD:
    gauge: 24 AWG
    length: 0.3
    colors:
    - WH
    - BK
    notes: adapter D/G → bus signal + GND (V+ OMITTED)
  W_GND_BOND:
    gauge: 22 AWG
    length: 0.1
    colors:
    - BK
    notes: common-ground bond (bus has no return without it)
  W_I2C:
    gauge: 28 AWG
    length: 0.15
    colors:
    - RD
    - BK
    - YE
    - GN
    notes: Uno Q I2C (own bus, separate from servo bus); 3V3!
  W_PWR_L0:
    gauge: 16 AWG
    length: 0.1
    colors:
    - RD
    - BK
    notes: trunk Wagos → leg 0 corner power Wago pair
  W_BR_L0:
