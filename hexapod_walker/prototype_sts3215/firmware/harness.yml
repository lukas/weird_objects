# Topology: firmware/WIRING.md; branch lengths: motor_setup/wire_harness_plan.py.
metadata:
  title: Hexapod STS3215 — distributed-power + serial-bus harness
  description: Generated by scripts/render_harness_diagram.py from firmware/WIRING.md
    (topology) + motor_setup/wire_harness_plan.py (per-leg branch lengths). DO NOT
