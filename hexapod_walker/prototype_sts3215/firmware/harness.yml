options:
  fontname: Helvetica
connectors:
  LIPO:
    type: 3S LiPo (11.1 V nom)
    subtype: XT60 female
    pinlabels:
    - V+
    - GND
    notes: raw 12 V servo rail; no BEC anywhere
  SWITCH:
    type: Anti-spark switch
    subtype: XT60 in/out
    pinlabels:
    - IN V+
    - IN GND
    - OUT V+
    - OUT GND
    notes: precharge + on/off = e-stop
  FUSE:
    type: Main fuse 15-20 A
    subtype: blade/ANL in holder
    pinlabels:
    - IN
    - OUT
    notes: sized above ~9-12.6 A walking draw
  TRUNK_WAGO:
    type: Central trunk pair (2x 5-port Wago 221-415)
    pinlabels:
    - V+ IN
    - GND IN
    - V+ L0
    - V+ L1
    - V+ L2
    - V+ L3
    - V+ L4
    - V+ L5
    - GND L0
    - GND L1
    - GND L2
    - GND L3
    - GND L4
    - GND L5
    - GND DATA
    notes: chassis_top centre; logical per-leg feeds shown (5 physical ports per
      nut); optional 5-7 A branch fuses; no PDB — all lever nuts
  UNOQ:
    type: Arduino Uno Q
    pinlabels:
    - USB-C
    - VIN
    - GND
    - 3V3
    - SCL
    - SDA
    notes: gait/RL host (Linux side); own battery tap on VIN (on-board regulator,
      no buck); drives bus via MCU bridge (preferred) or USB adapter (fallback)
  ADAPTER:
    type: USB bus-servo adapter
    subtype: FE-URT-2 / Waveshare A
    pinlabels:
    - USB-C
    - D
    - G
    notes: level switch 5 V (FE-URT-2) / mode B (Waveshare); data-only on the full
      robot
  IMU:
    type: GY-521 (MPU-6050)
    pinlabels:
    - VCC
    - GND
    - SCL
    - SDA
    notes: I2C addr 0x68; POWER FROM 3V3, NEVER 5 V; glued on chassis_top beside
      the central trunk Wagos
  SERVO2:
    type: FEETECH STS3215
    subtype: Molex 5264 3-pin
    pinlabels:
    - GND
    - V+
    - SIG
    notes: L0 yaw — joint 0, bus ID 2; lead budget 80 mm (STS3215 stock bus lead)
  SERVO3:
    type: FEETECH STS3215
    subtype: Molex 5264 3-pin
    pinlabels:
    - GND
    - V+
    - SIG
    notes: L0 hip — joint 1, bus ID 3; lead budget 110 mm (STS3215 stock bus lead)
  SERVO4:
    type: FEETECH STS3215
    subtype: Molex 5264 3-pin
    pinlabels:
    - GND
    - V+
    - SIG
    notes: L0 knee — joint 2, bus ID 4; lead budget 140 mm (STS3215 stock bus lead)
  L0_WAGO:
    type: Power Wago pair (2x Wago 221-413)
    pinlabels:
    - V+
    - GND
    notes: leg 0 12 V+G 3-port lever nuts in the integrated chassis corner tray,
      entries facing inward
  L0_INJ:
    type: Molex 5264 pigtail
    subtype: crimped 3-pin
    pinlabels:
    - GND
    - V+
    - SIG
    notes: leg 0 V+/GND injection at the HIP (mates SERVO3's spare port; ~3 A/pin
