# Scale-out GPU train pods (2026-08-09, operator: ONE POOL, >=4 slots/machine).
# hexapod-mjx-train-4..15, pinned 4 per node (cpu request 24 so 4 fit
# beside the controller's 24 cores on g142d86; train-0..3 on g131eec
# keep their original 26-core spec).
#   g142d86: train-4..7 (+ controller)   g129004: train-8..11
#   g12ba48: train-12..15                g131eec: train-0..3
#
# 2026-08-09: g12ba48 was CORDONED by CoreWeave and train-12..15 were
# deleted (Pending 3h+, no node fits 4 more 24-core pods). They are
# also removed from guardrails gpu_pods. When a 4th node returns:
# repoint the 12..15 nodeSelector below to it, kubectl apply this
# file, run bootstrap_train_pod.sh for each, re-add to gpu_pods.
# Fleet: 16 slots. Live truth: uv run python rl_move/orchestrator/capacity.py
# Pods may sit Pending while CoreWeave hpc-verification health checks
# hold a node's GPUs; they schedule as soon as the check releases.
# Bootstrap after apply: bash rl_move/orchestrator/bootstrap_train_pod.sh <pod>
apiVersion: v1
kind: Pod
metadata:
  name: hexapod-mjx-train-4
  namespace: default
  labels:
    app: hexapod-mjx-train
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: g142d86
  containers:
    - name: train
      image: python:3.11-slim
      command: ["sleep", "infinity"]
      workingDir: /workspace
      volumeMounts:
        # 64M default /dev/shm SIGBUS-kills sharded-trainer workers
        # (~58M/normal run; hist16+ layouts exceed 64M) — see
        # coreweave_pod_mjx_train.yaml note, 08-10.
        - name: dshm
          mountPath: /dev/shm
      env:
        - name: MUJOCO_GL
          value: osmesa
        - name: XLA_PYTHON_CLIENT_MEM_FRACTION
          value: "0.30"
      resources:
        requests:
          cpu: "24"
          memory: 48Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "26"
          memory: 96Gi
          nvidia.com/gpu: "1"
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi

