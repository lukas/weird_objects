wiring:
  route-j00:
    purpose: "L0 leg bundle: drop slot -> down retainer window -> YAW ID 2 BACK-face 5264 ports"
  route-j01:
    purpose: "L0 daisy: YAW ID 2 -> HIP ID 3 (BACK ports, under yaw / around \u2212X face)"
  route-j02:
    purpose: "L0 daisy: HIP ID 3 -> KNEE ID 4 (BACK ports, zip-tied on femur spar top, crosses near hip axis)"
  route-j03:
    purpose: "L1 leg bundle: drop slot -> down retainer window -> YAW ID 5 BACK-face 5264 ports"
  route-j04:
    purpose: "L1 daisy: YAW ID 5 -> HIP ID 6 (BACK ports, under yaw / around \u2212X face)"
  route-j05:
    purpose: "L1 daisy: HIP ID 6 -> KNEE ID 7 (BACK ports, zip-tied on femur spar top, crosses near hip axis)"
  route-j06:
    purpose: "L2 leg bundle: drop slot -> down retainer window -> YAW ID 8 BACK-face 5264 ports"
  route-j07:
    purpose: "L2 daisy: YAW ID 8 -> HIP ID 9 (BACK ports, under yaw / around \u2212X face)"
  route-j08:
    purpose: "L2 daisy: HIP ID 9 -> KNEE ID 10 (BACK ports, zip-tied on femur spar top, crosses near hip axis)"
  route-j09:
    purpose: "L3 leg bundle: drop slot -> down retainer window -> YAW ID 11 BACK-face 5264 ports"
  route-j10:
    purpose: "L3 daisy: YAW ID 11 -> HIP ID 12 (BACK ports, under yaw / around \u2212X face)"
  route-j11:
    purpose: "L3 daisy: HIP ID 12 -> KNEE ID 13 (BACK ports, zip-tied on femur spar top, crosses near hip axis)"
  route-j12:
    purpose: "L4 leg bundle: drop slot -> down retainer window -> YAW ID 14 BACK-face 5264 ports"
  route-j13:
    purpose: "L4 daisy: YAW ID 14 -> HIP ID 15 (BACK ports, under yaw / around \u2212X face)"
  route-j14:
    purpose: "L4 daisy: HIP ID 15 -> KNEE ID 16 (BACK ports, zip-tied on femur spar top, crosses near hip axis)"
  route-j15:
    purpose: "L5 leg bundle: drop slot -> down retainer window -> YAW ID 17 BACK-face 5264 ports"
  route-j16:
    purpose: "L5 daisy: YAW ID 17 -> HIP ID 18 (BACK ports, under yaw / around \u2212X face)"
  route-j17:
    purpose: "L5 daisy: HIP ID 18 -> KNEE ID 19 (BACK ports, zip-tied on femur spar top, crosses near hip axis)"
  route-trunk-lipo-switch:
    purpose: "power trunk 12-14 AWG: LiPo XT60 -> anti-spark switch (rises past the top-plate +X edge)"
  route-trunk-switch-pdb:
    purpose: "power trunk 12-14 AWG: switch -> 15-20 A main fuse (inline) -> PDB on chassis_top"
  route-logic-battery-uno:
    purpose: "battery/PDB tap -> Uno Q (no buck; 20 AWG V+/GND; Uno Q accepts the 3S rail via its own regulator)"
  route-data-head:
    purpose: "Uno Q USB-C -> motor controller / USB bus-servo adapter -> servo ID 2 bus head (L0 yaw, data)"
  route-i2c-imu:
    purpose: "Uno Q I2C -> GY-521 MPU glued on chassis_bottom (behind phys. leg 1; 28 AWG 3V3/GND/SCL/SDA -- 3V3)"
  route-pwr-L0:
    purpose: "L0 power 16-18 AWG: PDB -> peripheral Wago -> leg 0 drop (V+/GND)"
  route-pwr-L1:
    purpose: "L1 power 16-18 AWG: PDB -> peripheral Wago -> leg 1 drop (V+/GND)"
  route-pwr-L2:
    purpose: "L2 power 16-18 AWG: PDB -> peripheral Wago -> leg 2 drop (V+/GND)"
  route-pwr-L3:
    purpose: "L3 power 16-18 AWG: PDB -> peripheral Wago -> leg 3 drop (V+/GND)"
  route-pwr-L4:
    purpose: "L4 power 16-18 AWG: PDB -> peripheral Wago -> leg 4 drop (V+/GND)"
  route-pwr-L5:
    purpose: "L5 power 16-18 AWG: PDB -> peripheral Wago -> leg 5 drop (V+/GND)"
  route-data-L0L1:
    purpose: "leg 0 -> leg 1 data jumper via underside data Wagos (signal+GND only, NO V+)"
  route-data-L1L2:
    purpose: "leg 1 -> leg 2 data jumper via underside data Wagos (signal+GND only, NO V+)"
  route-data-L2L3:
    purpose: "leg 2 -> leg 3 data jumper via underside data Wagos (signal+GND only, NO V+)"
  route-data-L3L4:
    purpose: "leg 3 -> leg 4 data jumper via underside data Wagos (signal+GND only, NO V+)"
  route-data-L4L5:
    purpose: "leg 4 -> leg 5 data jumper via underside data Wagos (signal+GND only, NO V+)"
