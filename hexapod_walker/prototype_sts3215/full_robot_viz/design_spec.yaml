# Hexapod — full robot with the bearing-sandwich joint architecture (viz).
#
# Kinematics FROZEN: 6 legs, COXA 25 / FEMUR 90 / TIBIA 130 mm, stance
# angles and CHASSIS_YAW_OUTPUT_Z pinned to the working model so MuJoCo and
# the gait controller stay valid. Only the joint/segment CONSTRUCTION changes.
#
#   YAW  joint : cantilevered (coxa 25 mm < ~50 mm rule -> no passive bearing)
#   HIP  joint : bearing sandwich (driven disc horn + 688 passive bearing)
#   KNEE joint : bearing sandwich
#   FEMUR/TIBIA: dia-8 carbon-fibre tube between printed joint fittings

parts:
  servo:
    description: "FEETECH STS3215 serial-bus servo (real FEETECH geometry). 18 total (3 per leg)."
    qty: 18
  housing:
    description: "Printed joint housing. Yaw = front M2 plate + side walls. Hip/knee add the partial back housing with a 688 press-pocket for the passive bearing."
    qty: 18
  disc_horn:
    description: "Driven dia-20 25T disc horn on each servo output; the moving link bolts to it on a dia-14 / 4x M3 circle."
    qty: 18
  bearing:
    description: "688-2RS ball bearing (dia16 x dia8 x 5) on the passive side of each hip and knee joint (12 total)."
    qty: 12
  yoke:
    description: "Printed moving-link end-fitting that straddles the servo: top arm to the disc horn (driven), bottom stub to the 688 bearing (passive), socket for the dia-8 CF tube."
    qty: 12
  coxa:
    description: "Short (25 mm) coxa link driven by the yaw disc horn; carries the hip joint at its outboard end. Cantilevered (no passive bearing)."
    qty: 6
  tube:
    description: "dia-8 carbon-fibre leg segment. Femur (90 mm) hip->knee and tibia (130 mm) knee->foot. Retained by epoxy bond + a transverse retention pin."
    qty: 12
  pin:
    description: "dia-2.5 transverse retention pin (roll pin or M2.5 screw) through socket-wall/tube/socket-wall at each tube socket mouth. Locks pull-out AND spin even if the epoxy bond fails. 12 total."
    qty: 12
  foot:
    description: "Compliant foot pad at each tibia tip."
    qty: 6
  chassis_bottom:
    description: "Hex bottom plate with 6 integrated yaw cradles (existing part, shown for context)."
    qty: 1
  chassis_top:
    description: "Hex top plate (existing part, shown for context)."
    qty: 1
