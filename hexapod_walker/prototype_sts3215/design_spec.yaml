  tibia_foot_fitting:
    description: "Tibia's FOOT-end fitting (Jun 2026 bearing-sandwich): the tibia Phi 8 CF-tube socket (tube enters from -X) plus a single LINK_THICKNESS-thin foot-hinge TANG projecting +X.  The tang seats in the foot_pad's 2-cheek fork and is captured by an M3 x 16 pan-head + nyloc hinge pin (axis Y).  Local frame: origin at the tube-socket mouth; +X to the tang tip, +Y = hinge axis."
    qty: 6
    bounds_mm: [42.0, 14.0, 16.0]       # measured (on disk): x in [-20.0, 22.0] (tube socket toward -X to -20, tang to +22), y in [-7.0, 7.0] (socket boss OD; tang is LINK_THICKNESS = 6 thin), z in [-8.0, 8.0] (socket boss + tang height 16)
    holes:
      - name: hinge_pin
        diameter_mm: 3.4                # = FOOT_HINGE_PIN_HOLE_D (M3 clearance; M3 x 16 pan-head + nyloc)
        position_mm: [16.0, 0.0, 0.0]   # through the tang, axis Y; lands in the foot_pad fork
        axis: y
    wire_channels: []
    keep_out_volumes: []
    shape:
      overall_form: "Two features fused: (a) a Phi 14 OD CF-tube socket boss (mouth at x = 0, extending toward -X to x = -20) whose Phi 8.3 bore + Phi 2.6 transverse retention pin (at x = -7) bond the tibia CF tube; and (b) a 22 x LINK_THICKNESS(6) x 16 mm rectangular tang centred at (11, 0, 0) projecting +X, thin in Y so it seats inside the foot_pad fork slot.  A Phi 3.4 M3 hinge bore runs along Y through the tang at x = 16."
      print_orientation_rationale: "Lay the tube-socket axis on the bed so the hinge bore is a horizontal Y through-cut and the tang prints flat (no overhangs > 45 deg)."
      features:
        - name: tibia_tube_socket
          type: cylindrical_boss
          description: "Phi 14 OD socket boss (radius LEG_TUBE_OD/2 + 3 = 7) with mouth at x = 0 extending toward -X.  Phi 8.3 bore accepts the tibia Phi 8 CF tube (epoxy); transverse Phi 2.6 retention pin along Y at x = -LEG_TUBE_PIN_INSET = -7."
          centre_mm: [-10.0, 0.0, 0.0]
          length_mm: 20.0               # = LEG_TUBE_SOCKET_DEPTH + 6
          diameter_mm: 14.0             # = LEG_TUBE_OD + 6
          inner_diameter_mm: 8.3        # tube bore (coaxial with the retention pin; not centreline-probeable)
          axis: x
          mating_face:
            normal: -x
            mates_to: "tibia Phi 8 mm carbon-fibre tube (epoxy + transverse Phi 2.6 retention pin); other end sockets into tibia_knee_yoke"
            mating_plane_z_local_mm: 0.0
        - name: foot_hinge_tang
          type: rectangular_tang
          description: "Single solid tang projecting +X (x in [0, 22]), LINK_THICKNESS = 6 mm thin in Y so it slides into the foot_pad fork slot (FOOT_HINGE_SLOT_W = 6.4 mm, 0.2 mm clearance per side).  A Phi 3.4 M3 hinge bore runs along Y at x = 16; an M3 x 16 pan-head + nyloc captures the tang between the fork cheeks."
          centre_mm: [11.0, 0.0, 0.0]
          length_mm: 22.0
          width_mm: 6.0                 # = HP.LINK_THICKNESS (Y depth)
          height_mm: 16.0
          axis: x
          mating_face:
            normal: +y
            mates_to: "foot_pad fork slot inner faces (tang slides in along +X; M3 pin captures both)"
            mating_plane_z_local_mm: 0.0
          holes_on_feature: [hinge_pin]

  # June 2026 bearing-sandwich refit: the single-piece pad-mating
  # femur_link / tibia_link parts were REPLACED by printed sandwich
  # sub-parts.  Jul 2026 merge #2 brought the femur back to ONE printed
  # part -- femur_link above (hip yoke + solid Phi 14 spar + knee
  # cradle; the interim femur_hip_yoke / femur_knee_bracket / separate
  # femur_strut are all retired).  The tibia span is still a Phi 8 mm
  # carbon-fibre tube: tibia_link exists only as an ASSEMBLY mesh
  # (yoke + CF tube + fitting) for BuildViz / MuJoCo / the verifier and
  # is NOT a printable solid, so it is intentionally absent from this
  # validated parts registry.  See coordinate_systems above for frames.


  foot_pad:
    description: "Compliant TPU foot with hinge FORK that captures the tibia tang."
    qty: 6
    # Hinge inversion (May 2026): the foot now carries the FORK (2
    # cheeks each FOOT_HINGE_CHEEK_T = 3.5 mm thick with a
    # FOOT_HINGE_SLOT_W = LINK_THICKNESS + 0.4 = 6.4 mm slot
    # between them).  Total Y extent across the fork = 2*3.5 + 6.4
    # = 13.4 mm, which is still inside the disk's 28 mm OD.  The
    # bounding box's Y face moves out from the OLD foot's tongue
    # (4 mm wide) to 13.4 mm, but 13.4 < 28 so the disk's OD is
    # still the dominant Y dimension; bounds_mm Y stays at 28 mm.
    bounds_mm: [28.0, 28.0, 18.0]
    holes:
      - name: hinge_pin
        diameter_mm: 3.4                 # = FOOT_HINGE_PIN_HOLE_D (M3 clearance; M3 x 16 pan-head + nyloc)
        position_mm: [0.0, 5.0, 14.0]    # bore axis is along Y at (x=0, z=FOOT_HINGE_FOOT_Z=14); probed at y=+5 INSIDE the +Y fork cheek (the bore's centreline at y=0 runs through the empty fork SLOT, so the probe samples a point on the bore where it actually passes through cheek material -- cheek spans y in [3.2, 6.7])
        axis: y
    wire_channels: []
    keep_out_volumes: []
    shape:
      overall_form: "Compliant TPU foot.  Bottom is a Phi 28 mm x 4 mm flat disk (the ground-contact spring); a short Phi 14 mm x 3 mm stiffening boss stacks on top of the disk; a 2-cheek hinge fork rises above the boss, with each cheek 3.5 mm thick in Y and a 6.4 mm-wide slot between them that captures the tibia tang.  An M3 hinge bore at foot-local z = 14 mm runs along +Y through both cheeks."
      print_orientation_rationale: "Drop the disk's ground-contact face to the bed (no rotation).  Fork cheeks rise in +Z so the M3 hinge bore is a horizontal Y-axis through-cut (no overhangs > 45 deg).  TPU 95A prints the 3.5 mm cheek walls as solid vertical TPU walls; the disk's broad face gives an enormous bed-contact footprint for adhesion."
      features:
        - name: disk
          type: cylindrical_disc
          description: "Ground-contact TPU spring.  Phi 28 mm x 4 mm thick; the entire disk flexes under foot-strike load and the TPU compliance absorbs roll while the M3 hinge passively pitches the foot."
          centre_mm: [0.0, 0.0, 2.0]
          diameter_mm: 28.0           # = HP.FOOT_PAD_OD
          thickness_mm: 4.0           # = HP.FOOT_PAD_BASE_H
          axis: z
          mating_face:
            normal: -z
            mates_to: "ground"
            mating_plane_z_local_mm: 0.0
        - name: boss
          type: cylindrical_boss
          description: "Stiffening boss between the disk and the fork.  Phi 14 mm x 3 mm tall; gives the fork a wider root than its 10 x 13.4 mm cross-section."
          centre_mm: [0.0, 0.0, 5.5]
          diameter_mm: 14.0           # = HP.FOOT_PAD_BOSS_OD
          height_mm: 3.0              # = HP.FOOT_PAD_BOSS_H
          axis: z
        - name: fork
          type: fork
          description: "2-cheek fork that captures the tibia tang.  Cheek inner faces sit at +/- HP.FOOT_HINGE_SLOT_W/2 = +/- 3.2 mm; outer faces at +/- (SLOT_W/2 + CHEEK_T) = +/- 6.7 mm.  Each cheek X extent = HP.FOOT_HINGE_FORK_X = 10 mm (matches the pre-inversion tongue's X width so the joint preserves the same rotational clearance the old tongue + slot pair had).  Z extent = [boss_top, FOOT_HINGE_FOOT_Z + FOOT_HINGE_FORK_OVER_PIN] = [+7, +18]."
          centre_mm: [0.0, 0.0, 12.5]
          length_mm: 10.0             # = HP.FOOT_HINGE_FORK_X (X extent of each cheek)
          width_mm: 13.4              # = 2 * HP.FOOT_HINGE_CHEEK_T + HP.FOOT_HINGE_SLOT_W = 2*3.5 + 6.4
          height_mm: 11.0             # fork_z_hi - fork_z_lo = 18 - 7
          wall_thickness_mm: 3.5      # = HP.FOOT_HINGE_CHEEK_T per cheek (TPU above MIN_PRINT_T = 3.0)
          mating_face:
            normal: +y
            mates_to: "tibia foot_tang (tang slides INTO the slot along +X; M3 pin captures both)"
            mating_plane_z_local_mm: 14.0    # = HP.FOOT_HINGE_FOOT_Z (pin axis Z in foot-local)
          holes_on_feature: [hinge_pin]
          notes: "Slot width = HP.FOOT_HINGE_SLOT_W = LINK_THICKNESS + 0.4 = 6.4 mm accepts the LINK_THICKNESS = 6 mm tang with 0.2 mm clearance per side."

  # June 2026 bearing-sandwich refit: bec_cradle RETIRED -- the dual
  # 5V/5A BEC power scheme was dropped, so the snap-fit cradle part no
  # longer exists (no bec_cradle.stl is emitted).

  switch_holster:
    description: "Printed holster for the anti-spark XT60 on/off switch.  Mounts to chassis_top's +X edge between the L0 and L5 yaw cradles.  Two-part body: (1) socket (+X half), a 5-walled open-top box that snugs the switch body in with SWITCH_BODY_CL = 0.5 mm clearance per axis, with the toggle poking out a 14 x 10 mm cutout in the +X end wall and 2 XT60 pigtails exiting Phi 6 mm holes in the -X end wall; (2) mounting ear (-X half), a flat 14 x 22 x 4 mm plate that sits on chassis_top's TOP face on the 2 chassis-top bosses, clamped down by 2 M3 SHCS that thread DOWN from above into the brass heat-set inserts in the chassis_top bosses."
    qty: 1
    bounds_mm: [51.0, 22.0, 21.5]       # measured: SWITCH_HOLSTER_OUTER_L = SWITCH_SOCKET_OUTER_L + SWITCH_EAR_L = (32 + 1 + 4) + 14 = 51, SWITCH_HOLSTER_OUTER_W = SWITCH_BODY_W + 2*CL + 2*WALL = 17 + 1 + 4 = 22, socket_outer_h = SWITCH_BODY_H + SWITCH_BODY_CL + SWITCH_HOLSTER_FLOOR = 17 + 0.5 + 4 = 21.5
    holes: []
    wire_channels: []
    keep_out_volumes: []
    shape:
      overall_form: "Two-zone block.  +X half is a 5-walled open-top socket (37 x 22 x 21.5 mm outer) that snugs the switch body; -X half is a flat mounting ear (14 x 22 x 4 mm) that bolts to chassis_top.  Toggle cutout (14 x 10 mm) on the +X end wall; 2 Phi 6 mm XT60 pigtail bores on the -X end wall at z = floor + body_h/2 = 11 mm."
      print_orientation_rationale: "Drop the ear's bottom face to the bed (no rotation).  Socket cavity opens +Z so the switch body drops in from above; toggle cutout and pigtail bores print as horizontal cuts through the side walls (no overhangs).  The bottom of the socket (= ear top? No -- the socket floor at z = SWITCH_HOLSTER_FLOOR = 4 mm) prints as a closed slab over the ear's air gap; this is a 32 x 22 mm bridge over 4 mm of empty air, well within FDM bridge tolerance."
      features:
        - name: socket
          type: rectangular_well
          description: "+X half of the body.  Open-top 5-walled box that holds the anti-spark switch.  Inner cavity = SWITCH_BODY_L + 1 mm x SWITCH_BODY_W + 1 mm x SWITCH_BODY_H + 0.5 mm = 33 x 18 x 17.5 mm; outer = 37 x 22 x 21.5 mm.  Floor at z = SWITCH_HOLSTER_FLOOR = 4 mm; walls (SWITCH_HOLSTER_WALL = 2 mm) wrap the +/-X / +/-Y / +Z sides except for the toggle and pigtail cutouts."
          centre_mm: [11.5, 0.0, 10.75]   # socket_centre_x = outer_l/2 - socket_l/2 = 25.5 - 18.5 = 7; z mid = socket_outer_h/2 = 10.75 -- but socket spans x in [socket_centre_x - socket_l/2, socket_centre_x + socket_l/2] which after the SWITCH_EAR_L offset is on the +X side
          length_mm: 37.0             # = HP.SWITCH_SOCKET_OUTER_L (= HP.SWITCH_BODY_L + 1 + 2*HP.SWITCH_HOLSTER_WALL)
          width_mm: 22.0              # = HP.SWITCH_HOLSTER_OUTER_W
          height_mm: 21.5             # socket_outer_h
          wall_thickness_mm: 2.0      # = HP.SWITCH_HOLSTER_WALL
        - name: toggle_cutout
          type: slot
          description: "14 x 10 mm rectangular cutout through the +X end wall of the socket so the switch's toggle lever pokes out into open air past the chassis +X vertex.  Centred vertically on the switch body at z = SWITCH_HOLSTER_FLOOR + SWITCH_BODY_H/2 = 12.5 mm."
          centre_mm: [25.0, 0.0, 12.5]
          length_mm: 2.4              # = HP.SWITCH_HOLSTER_WALL + 0.4 mm overshoot
          width_mm: 14.0              # = HP.SWITCH_TOGGLE_W
          height_mm: 10.0             # = HP.SWITCH_TOGGLE_H
        - name: xt60_pigtail_channel_pair
          type: slot
          description: "2 Phi 6 mm pigtail exit channels through the -X end wall of the socket (= the wall between the socket cavity and the mounting ear).  XT60 pigtails exit here on their way to the battery / power bus.  Centred vertically on the switch body at z = 11 mm; offset +/-5 mm in Y."
          centre_mm: [-7.5, 5.0, 11.0]    # one of 2; symmetric pair at +/-Y
          diameter_mm: 6.0             # = HP.SWITCH_PIGTAIL_OD
          height_mm: 2.4               # = HP.SWITCH_HOLSTER_WALL + 0.4 mm overshoot
          axis: x
        - name: mounting_ear
          type: extruded_rectangle
          description: "-X half of the body.  Flat 14 x 22 x 4 mm plate that sits on chassis_top's TOP face on the 2 switch_holster bosses (Phi 8 mm bosses 3 mm above the chassis_top plate top).  Carries 2 vertical M3 clearance holes for the SHCS that clamp the ear to the chassis_top bosses."
          centre_mm: [-18.5, 0.0, 2.0]
          length_mm: 14.0              # = HP.SWITCH_EAR_L
          width_mm: 22.0               # = HP.SWITCH_HOLSTER_OUTER_W
          thickness_mm: 4.0            # = HP.SWITCH_HOLSTER_FLOOR
          mating_face:
            normal: -z
            mates_to: "chassis_top switch_holster_boss_pair top faces (ear bottom rests on the boss tops at chassis-z = CHASSIS_GAP + CHASSIS_PLATE_T + SWITCH_HOLSTER_BOSS_H)"
            mating_plane_z_local_mm: 0.0
        - name: ear_bolt_pair
          type: slot
          description: "2 Phi 3.4 mm M3 clearance holes through the ear (top to bottom).  Bolt enters from above, passes through the ear, threads into the brass insert in the chassis_top boss below."
          centre_mm: [-18.5, 5.0, 2.0]    # one of 2; symmetric pair at +/-5 mm in Y per HP.SWITCH_HOLSTER_BOLT_DY
          diameter_mm: 3.4              # = HP.BRACKET_BOLT_HOLE
          height_mm: 16.0               # = SWITCH_HOLSTER_FLOOR * 4
          axis: z

  imu_pad:
    description: "Vibration-isolated mounting pad for the MPU-6050 / GY-521 IMU breakout (May 2026 'essentials' pass).  The pad is a thin 25 x 20 x 2 mm flat plate with 4 short Phi 8 mm bosses at the IMU's 15.0 x 11.0 mm hole pattern.  Each boss carries a Phi 4 mm M3 brass heat-set insert in a 6 mm-deep pocket opening DOWNWARD from the boss top.  No fasteners between the pad and chassis_top -- the pad is GLUED to chassis_top with a 3 mm-thick strip of 3M VHB / generic double-sided mounting foam tape; the foam tape doubles as the mount AND the vibration damper."
    qty: 1
    bounds_mm: [25.0, 20.0, 7.2]        # = IMU_PAD_W, IMU_PAD_D, IMU_PAD_T + IMU_PAD_BOSS_H + 0.2 (overdrill chamfer on boss top) = 2 + 5 + 0.2
    holes: []
    wire_channels: []
    keep_out_volumes: []
    shape:
      overall_form: "Small rectangular plate (25 x 20 x 2 mm) with 4 short Phi 8 mm bosses on its +Z face arranged in a 15 x 11 mm rectangular pattern centred on the pad.  Bottom face is deliberately FLAT and free of features (foam-tape adhesion).  Each boss is 5 mm tall and carries an M3 heat-set insert pocket on its top face."
      print_orientation_rationale: "Drop the flat bottom face to the bed (no rotation).  Bosses point +Z so each insert pocket prints as a recessed cavity opening upward.  No supports needed; the part is small enough that the 8 mm boss diameter on a 2 mm floor prints reliably with a 5 mm brim."
      features:
        - name: floor
          type: extruded_rectangle
          description: "The flat base plate.  Foam-tape adhesion side faces -Z (chassis_top); IMU bosses sit on +Z face."
          centre_mm: [0.0, 0.0, 1.0]
          length_mm: 25.0             # = HP.IMU_PAD_W
          width_mm: 20.0              # = HP.IMU_PAD_D
          thickness_mm: 2.0           # = HP.IMU_PAD_T
        - name: boss_x4
          type: cylindrical_boss
          description: "4 Phi 8 mm bosses at the IMU's 4-hole pattern (offsets +/-7.5 mm in X, +/-5.5 mm in Y).  Each boss rises 5 mm above the pad's TOP face and carries a Phi 4 mm x 6 mm M3 heat-set insert pocket opening UPWARD from the boss top; pocket bottom sits at z = +0.8 mm, leaving 0.8 mm of pad floor below the pocket so the BOTTOM face stays flat for foam-tape adhesion."
          centre_mm: [7.5, 5.5, 4.5]     # one of 4; centre = (sx*IMU_HOLE_PCD_X/2, sy*IMU_HOLE_PCD_Y/2, IMU_PAD_T + IMU_PAD_BOSS_H/2)
          diameter_mm: 8.0             # = HP.IMU_PAD_BOSS_OD
          inner_diameter_mm: 4.0       # = HP.INSERT_M3_PILOT_OD
          height_mm: 5.0               # = HP.IMU_PAD_BOSS_H above pad top
          axis: z
          mating_face:
            normal: +z
            mates_to: "MPU-6050 / GY-521 IMU PCB bottom face"
            mating_plane_z_local_mm: 7.0    # = HP.IMU_PAD_T + HP.IMU_PAD_BOSS_H

