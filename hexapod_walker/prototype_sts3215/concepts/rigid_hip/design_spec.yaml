# Design spec — sts3215-rigid-hip (CONCEPT BUILD, not production).
#
# User idea, Aug 2026: the production yaw joint rides a 6805-2RS pair in
# chassis_bottom's tower, but the coxa link + hip servo above it are a
# cantilever — leg loads twist the hip about the bearing pair.  This
# variant adds a THIRD 6805 per leg above the hip: the hip clamp cap is
# extended up along the yaw axis into an inner-race press boss, and a
# second full-size (200 mm flat-to-flat) hex plate pockets all six outer
# races from below.  Each yaw axis becomes simply-supported; the hip
# servo is held rigidly between the two plates.
#
# Every fit reuses a bench-tuned production constant (YAW_HUB_BOSS_OD
# press boss, YAW_TOWER_BORE_OD race pocket, YAW_TOWER_SHOULDER_OD
# retaining lip, YAW_TOWER_WALL ring wall).
#
# Measured trade-off (build-time sweep in make_rigid_hip_variant.py):
# the plate caps femur up-swing at -47.5 deg (production workspace
# allowed -80).  Walking near STANCE_FEMUR_DEG = -25 keeps ~22 deg of
# headroom; deep tucks (stand-up belly curl) must be re-checked before
# this goes on the robot.
#
# Bearing count (user, Aug 24: "one bearing on the bottom -- simplify"):
# ONE bottom bearing per leg, seated directly in chassis_bottom's own
# open-top phi 37.15 pocket (the production LOWER-race position; seat
# and drop-in path are print-proven).  The bolt-on yaw_bearing_cap is
# DELETED (-6 prints, -18 M3 screws): its radial-housing job moves to
# the pocket's 4 mm press band, its retention job splits by direction
# (hanging loads: hub seat ring -> inner race -> outer race -> tower
# seat; standing loads: up through the TOP bearing into the plate
# shoulder).  The coxa hub grows a phi 29 seat ring down to the
# relocated race top (the coxa is already a variant print).  Bearing
# couple ~65 mm mid-plane to mid-plane.  Net 12 bearings per robot,
# same as production.

parts:
  hip_clamp_cap_rigid:
    label: "Hip clamp cap + yaw-axis bearing boss (concept)"
    aliases: ["rigid hip cap", "extended cap", "boss cap"]
    description: >-
      The stock make_servo_clamp_cap() hip clamshell lid grown UP along
      the yaw axis: a phi 29 pedestal (inner-race seat shoulder, same
      role as the yaw hub's flange) and a phi 25.15 press boss that the
      third 6805-2RS presses onto, with a phi 24 x 0.8 stepped lead-in.
      The stack is coaxial with the YAW axis (cap-local x = 0,
      z = 15.65), landing on solid flange-bar material >9 mm clear of
      the two M3 counterbores.  Same 2x M3 mounting into the same coxa
      cradle pilots; knee caps stay stock.  6 per robot.
    generated_by:
      file: "concepts/rigid_hip/make_rigid_hip_variant.py"
      function: "make_hip_cap_rigid"
      output_stl: "stl/hip_clamp_cap_rigid.stl"
    local_frame:
      origin: "Hip servo well frame (body back-face centre)"
      axes:
        x: "Servo body long axis (radial, outboard = +x)"
        y: "Out of the open well face — world UP at the hip"
        z: "Hip servo output (pitch) axis direction"
    features:
      pedestal:
        label: "Phi 29 inner-race seat pedestal"
        kind: "boss"
        purpose: >-
          Axial seat for the bearing inner race (phi 29 = the 6805
          inner-race outer diameter, so the race is fully backed).
          Height 5.5 mm sets the whole stack; its top face is the race
          seat plane at world z 81.05.
        llm_context: >-
          Taller pedestal = higher plate = more femur up-range but a
          longer cantilever inside the bearing and taller standoffs.
          The build-time sweep prices this trade; re-run it before
          changing PED_H.
        dimensions:
          ped_od:
            label: "Pedestal OD"
            value: 29.0
            code_name: PED_OD
            description: "= YAW_BEARING_INNER_OD (full inner-race backing)."
          ped_h:
            label: "Pedestal height above the cap face"
            value: 5.5
            code_name: PED_H
      press_boss:
        label: "Phi 25.15 inner-race press boss"
        kind: "boss"
        purpose: >-
          Presses into the 6805 bore with the same +0.15 diametral
          interference the production yaw hub boss uses
          (YAW_HUB_BOSS_OD); 6.2 mm press band + 0.8 mm stepped lead-in
          tip at phi 24.
        llm_context: >-
          Print the boss as a VERTICAL cylinder (rest the cap on its
          tongue face) or the press band gets support scars; the +0.15
          constant assumes the production boss's bench history.
        dimensions:
          boss_od:
            label: "Press boss OD"
            value: 25.15
            code_name: BOSS_OD
            description: "= YAW_HUB_BOSS_OD, bench-tuned +0.15 press."
      puller_notches:
        label: "2x pry slots under the inner race (last resort only)"
        kind: "relief"
        purpose: >-
          The cap is a CAPTIVE BEARING CARRIER: its 6805 is pressed on
          once and normal service never separates it (the cap unbolts
          from the coxa instead, via the plate's driver access holes).
          These two 8 mm-wide, 2.2 mm-deep notches at +/-x expose
          1.5 mm of the inner race's underside (r 13.0..14.5) purely as
          last-resort insurance so a worn bearing can still be walked
          off non-destructively.  Notch floor stays 0.4 mm clear of the
          phi 25.15 boss root; the remaining seat annulus carries the
          race with ample area.
        dimensions:
          notch_w:
            label: "Notch width"
            value: 8.0
            code_name: PULLER_NOTCH_W
          notch_depth:
            label: "Notch depth below the race seat"
            value: 2.2
            code_name: PULLER_NOTCH_DEPTH

  chassis_top_rigid:
    label: "Full-size top chassis FRAME with bearing pockets (concept)"
    aliases: ["top plate", "second chassis", "bearing plate", "frame"]
    description: >-
      A second 200 mm flat-to-flat, 4 mm hex sheet (chassis_bottom's
      footprint) at world z 88.05..92.05.  Six phi 44 full-height
      bosses — one per yaw axis, half-bulging outboard exactly like the
      bottom towers — pocket the third bearings' outer races from BELOW
      at phi 37.15, each retained by a complete 360-deg phi 34
      shoulder.  Carries the existing standoff pattern (4x M3 at
      +/-31.1), the electronics-deck pattern (+/-24.75), and a phi 40
      centre access hole.  Replaces the 140 mm chassis_top deck.
      1 per robot.
    generated_by:
      file: "concepts/rigid_hip/make_rigid_hip_variant.py"
      function: "make_chassis_top_rigid"
      output_stl: "stl/chassis_top_rigid.stl"
    local_frame:
      origin: "World/chassis frame (chassis_bottom sheet mid-plane z=0)"
      axes:
        x: "Chassis +x"
        y: "Chassis +y"
        z: "Up"
    features:
      race_pocket:
        label: "Phi 37.15 outer-race pocket (x6)"
        kind: "bore"
        purpose: >-
          Downward-opening pocket; the race presses up until its top
          face hits the phi 34 shoulder (= sheet bottom plane).  0.8 mm
          lead-in ring at the mouth; ring bottom sits 0.5 mm above the
          race seat so the shoulder always contacts first.
        dimensions:
          pocket_bore:
            label: "Pocket bore"
            value: 37.15
            code_name: POCKET_BORE
            description: "= YAW_TOWER_BORE_OD, bench-tuned firm finger-press."
          shoulder_od:
            label: "Race shoulder bore"
            value: 34.0
            code_name: SHOULDER_OD
            description: "= YAW_TOWER_SHOULDER_OD: retains the outer race, clears the spinning inner race."
          ring_od:
            label: "Pocket boss OD"
            value: 44.0
            code_name: RING_OD
            description: "= bearing OD + 2x YAW_TOWER_WALL, same wall as the bottom tower."
      cap_bolt_access:
        label: "Phi 7 driver pass-through above each inboard cap bolt (x6)"
        kind: "bore"
        purpose: >-
          With legs at yaw 0 (+/-2 deg) a hex driver reaches the hip
          cap's INBOARD clamp bolt through the plate (the outboard bolt
          sits beyond the hex edge under open sky), so the cap + its
          pressed bearing unbolt from the coxa as one captive unit and
          the plate lifts off with all six cap/bearing assemblies
          attached -- no press fit is ever separated in service.
          Positions derive from hp.servo_clamp_bolt_centres() through
          the leg placement transforms; build-time checks assert
          >= 1.74 mm web to the bearing ring, >= 1.5 mm to every other
          plate hole, and a clear phi 6.5 driver line-of-sight down to
          the cap counterbore.
        dimensions:
          access_hole_d:
            label: "Access hole diameter"
            value: 7.0
            code_name: ACCESS_HOLE_D
      hatch_opening:
        label: "Service-hatch opening (hex, 128 across flats)"
        kind: "cutout"
        purpose: >-
          A large hex chunk of the plate middle is removed so the
          interior stays serviceable (electronics, wiring, the central
          splice block).  Flats face the bearing rings, keeping a 14 mm web at
          every ring; vertices reach toward the inter-leg directions
          where the frame is widest.  The standoff, electronics-deck
          and centre holes all fell inside the opening and moved onto
          the removable top_hatch_rigid lid.  The six lid screws pass
          THROUGH the frame (phi 3.4 clearance) into the corner-pillar
          top plugs below; a second phi 3.4 hole per corner (rho 87)
          takes the dedicated frame-to-pillar screw that keeps the
          frame clamped down when the lid is off.
        dimensions:
          opening_apothem:
            label: "Opening apothem"
            value: 64.0
            code_name: HATCH_OPEN_APO
          screw_rho:
            label: "Lid screw radius (corner azimuths 0/60/...)"
            value: 76.2
            code_name: HATCH_SCREW_RHO

  top_hatch_rigid:
    label: "Removable service hatch (concept)"
    aliases: ["hatch", "lid", "access panel", "service cover"]
    description: >-
      A 4 mm hex lid (136 across flats) over the frame opening, sitting
      ON the deck face with a 1.5 mm registration lip dropping just
      inside the opening (0.3 mm/side clearance; straight drop-in
      verified at build time).  Held by 6x M3 x 16 button-heads that
      pass through lid AND frame into the corner-pillar top plugs,
      plus the 4 chassis standoff screws (standoff stacks grow to
      ~90 mm so they anchor the hatch; chassis-hang loads run
      standoffs -> hatch -> deck face -> frame in pure
      compression).  Carries the standoff pattern, the electronics-deck
      pattern and the phi 40 centre hole, so the electronics deck lifts
      out WITH the lid: 10 screws open the whole interior without
      touching the frame, bearings or legs.
    geometry_source:
      function: "make_top_hatch_rigid"
      output_stl: "stl/top_hatch_rigid.stl"
    local_frame:
      origin: "World/chassis frame (chassis_bottom sheet mid-plane z=0)"
      axes:
        x: "Chassis +x"
        y: "Chassis +y"
        z: "Up"
    features:
      registration_lip:
        label: "1.5 mm hex lip into the frame opening"
        kind: "boss"
        purpose: >-
          Registers the lid in shear against the frame opening walls
          (0.3 mm/side clearance) so the screws only clamp; restores
          some in-plane panel stiffness to the opened frame.
        dimensions:
          lip_h:
            label: "Lip height"
            value: 1.5
            code_name: HATCH_LIP_H
          lid_apothem:
            label: "Lid apothem"
            value: 68.0
            code_name: HATCH_APO

  corner_pillar:
    label: "Rim pillar tying the top frame to chassis_bottom (concept)"
    aliases: ["pillar", "corner column", "rim tie"]
    description: >-
      Solid printed column (elliptical section: 20 mm radial x 14 mm
      tangential) at each corner azimuth (rho 81.6, az 0/60/...), from
      the bottom sheet's top face (z 2) to 0.1 mm under the frame
      sheet (z 87.95; the six bearing RACES define the plate plane,
      the screws close the gap).  This is the variant's top-to-bottom
      structural tie: each hip moment's force couple reacts as rim
      shear (push at the bottom tower, pull at the top ring), which
      the four slender central standoffs at rho 44 could not carry;
      six rim columns take it at ~2x the radius with ~6x the section.
      PLAIN column (user, Aug 24: no scallops/weird shape) -- leg
      clearance is guaranteed by the rotating parts instead: every
      part turning with a yaw joint fits a ROT_ENVELOPE_R = 38.2 mm
      cylinder about its own axis (see coxa_link_rigid), and the
      column surface sits 43.24 mm from each neighbouring axis, so
      >= 5 mm clearance holds at EVERY yaw angle by construction
      (measured 5.03 mm; envelope + distance asserted on every
      rebuild; the hip servo never gets within 13.8 mm; clear even
      for a 360-deg hand spin).
      The foot fills the corner Wago-tray bay of chassis_bottom with
      0.3 mm clearance to its three 2.4 mm walls -- the production
      tray IS the shear/registration socket; the corner power splices
      (buried under solid deck in this variant anyway) consolidate
      into centre_wago_block.  6 per robot.
    generated_by:
      file: "concepts/rigid_hip/make_rigid_hip_variant.py"
      function: "make_corner_pillar"
      output_stl: "stl/corner_pillar.stl"
    local_frame:
      origin: "World/chassis frame; the STL is the az-0 pillar, others are 60-deg rotations"
      axes:
        x: "Chassis +x (radial at az 0)"
        y: "Chassis +y (tangential at az 0)"
        z: "Up"
    features:
      top_plug:
        label: "10 mm solid top plug with two M3 pilots"
        kind: "boss"
        purpose: >-
          Receives the shared hatch-perimeter screw (rho 76.2: one
          M3 x 16 clamps lid -> frame -> pillar) and the dedicated
          frame screw (rho 87) so the frame stays clamped with the lid
          off.  Phi 2.5 self-tap pilots, insert-ready (phi 4 x 6
          drill-out for 94459A130).
        dimensions:
          top_gap:
            label: "Nominal gap under the frame sheet"
            value: 0.1
            code_name: PILLAR_TOP_GAP
            description: >-
              Races locate the plate; screws pull the sheet down onto
              the pillar.  Sand/shim a proud pillar, never let it rock
              the plate off the races.
      bay_foot:
        label: "Wago-bay foot with 3 belly through-bolts"
        kind: "boss"
        purpose: >-
          4 mm plate filling the vacated tray bay (registration in
          tangential shear on the side walls, radial on the outer
          wall) plus an inboard tab whose bolt lands under the open
          hatch.  Three M3 through-bolts with nyloc nuts on the belly;
          the foot is the drill jig for the phi 3.4 holes through the
          8 mm sheet+floor (bench drill mod -- chassis_bottom is NOT
          reprinted).
        dimensions:
          key_clearance:
            label: "Foot-to-wall clearance per side"
            value: 0.3
            code_name: PILLAR_KEY_CL

  centre_wago_block:
    label: "Central power-splice block (concept)"
    aliases: ["wago block", "splice block", "power block"]
    description: >-
      The pillars claim the six corner Wago trays, so the power tree
      consolidates: 4x 5-port Wago 221-415 in one printed press-fit
      block at the chassis centre, replacing the 6 corner + 2 trunk
      nuts (8 -> 4).  Two back-to-back rows share the middle wall
      (north pair = V+, south pair = GND; each net's two nuts are
      jumpered, leaving battery-in + 6 leg branches + a spare port).
      Bays reuse the bench-tuned production tray constants (0.15 mm
      wedge across the port width, 2.4 mm walls stopping ~1.9 mm below
      the nut top); wire entries face outward so the leg pigtails fan
      in radially.  Footprint 66.9 x 44.1 mm centred on the origin --
      probed/asserted on solid sheet between the battery strap slots
      (2 mm shy of their inner edge y=24), 6+ mm from the standoff
      posts, west of the battery trunk pass whose leads land in the
      east ports.  Entirely under the 64 mm hatch opening, levers up;
      an open lever (z ~22) stays below the z 24 rotating band.
      Mounted on a VHB pad (the production corner trays' original,
      bench-proven scheme).  2 mm floor, walls 6.5 above it.  1 per
      robot, ~11 g.
    generated_by:
      file: "concepts/rigid_hip/make_rigid_hip_variant.py"
      function: "make_centre_wago_block"
      output_stl: "stl/centre_wago_block.stl"
    local_frame:
      origin: "World/chassis frame; floor bottom on the sheet top face (z 2)"
      axes:
        x: "Chassis +x (rows run along x)"
        y: "Chassis +y (rows separated in y; entries face +/-y)"
        z: "Up"
    features:
      bays:
        label: "4x 221-415 press-fit bays"
        kind: "pocket"
        purpose: >-
          Production tray press: bay width WAGO5_W - 0.15 wedges the
          nut across its ports; back face butts the shared middle
          wall.  Cross walls run past the bay fronts as ledges, like
          the production corner trays.
        dimensions:
          bay_width:
            label: "Bay width (block X)"
            value: 29.85
            code_name: WBLK_BAY_W
          bay_depth:
            label: "Bay depth (block Y)"
            value: 18.45
            code_name: WBLK_BAY_D

  wago5:
    label: "Wago 221-415 5-port lever nut — COTS"
    description: >-
      Visual stand-in (30 x 18.6 x 8.4 box), 4 per robot in this
      variant (was 8: 6 corner + 2 trunk).

  bearing_6805:
    label: "Top-plate 6805-2RS (25x37x7) — COTS, not printed"
    description: >-
      Same bearing as the production yaw joint; it is the 6 upper yaw
      bearings RELOCATED up to the top plate (2 per leg, 12 per robot,
      unchanged total).  Modeled with its bore at phi 25.15 (= the boss
      OD) so the seated scene has zero mesh overlap; the real bore is
      phi 25 and the 0.15 is the press.

  chassis_bottom:
    label: "Production chassis_bottom (unchanged, reference)"
    description: "Print from the main stl_prototype/ — unchanged by this variant."
  coxa_link:
    label: "coxa_link_rigid — rounded corners + tower-bearing seat ring (concept)"
    aliases: ["rigid coxa", "rounded coxa", "coxa link rigid", "servo holder"]
    description: >-
      The production coxa_link with two variant edits.  (1) ENVELOPE
      ROUND: its two servo-cradle corner edges are rounded to a
      38.2 mm arc about its own yaw axis (ROT_ENVELOPE_R): boolean
      intersection with the envelope cylinder removes at most 2.16 mm
      from corners that used to reach 40.36 mm.  This keeps every
      rotating part inside the envelope so the plain corner_pillar
      columns clear the swinging leg by >= 5 mm at every yaw angle --
      the user chose rounding the servo holder over scalloping the
      pillar.  (2) HUB SEAT RING: the phi 29 uflange extends down as a
      ring to coxa-local z 7.5, the top of the single bottom bearing
      now seated in the chassis tower pocket (production LOWER-race
      position); the ring bears only on the phi 25..29 inner-race
      land, the same contact the uflange made one race higher, and
      replaces the deleted yaw_bearing_cap's retention.  Hub, horn
      drive, cradle pilots and cap seat are untouched.  NOTE: this
      makes the coxa a VARIANT print (6x), replacing the stock
      coxa_link on this build.
    generated_by:
      file: "concepts/rigid_hip/make_rigid_hip_variant.py"
      function: "make_coxa_link_rigid"
      output_stl: "stl/coxa_link_rigid.stl"
    features:
      envelope_round:
        label: "Cradle-corner rounding arc"
        kind: "fillet"
        purpose: >-
          Caps the coxa's reach from its yaw axis so column clearance
          is guaranteed by the part, not by pillar shaping.
        dimensions:
          envelope_radius:
            label: "Yaw-axis envelope radius"
            value: 38.2
            code_name: ROT_ENVELOPE_R
      hub_seat_ring:
        label: "Phi 29 bottom-race seat ring"
        kind: "boss"
        purpose: >-
          Extends the hub uflange down to the tower-seated race top
          (coxa-local z 14.5 -> 7.5) so hanging-leg loads run hub ->
          ring -> inner race -> outer race -> tower seat with no
          bolt-on cap.  ID 24 merges the ring into the boss wall;
          OD 29 = the inner-race land, 2 mm clear of the phi 33
          outer-race band and its seal.
        dimensions:
          ring_od:
            label: "Ring OD (inner-race land)"
            value: 29.0
            code_name: HUB_RING_OD
          ring_z0:
            label: "Ring underside (coxa-local z) = race top"
            value: 7.5
            code_name: HUB_RING_Z0
  femur_link:
    label: "Production femur_link (unchanged, reference)"
    description: "Print from the main stl_prototype/ — unchanged by this variant."
  tibia_knee_yoke:
    label: "Production tibia_knee_yoke (unchanged, reference)"
    description: "Print from the main stl_prototype/ — unchanged by this variant."
  foot_boot:
    label: "Production foot_boot (unchanged, reference)"
    description: "Print from the main stl_prototype/ — unchanged by this variant."
  knee_clamp_cap:
    label: "Production servo clamp cap at the KNEE (unchanged)"
    description: >-
      The knee keeps the stock cap; only the six HIP caps become
      hip_clamp_cap_rigid.
  yaw_servo_retainer:
    label: "Production yaw servo retainer (unchanged, reference)"
    description: "Print from the main stl_prototype/ — unchanged by this variant."
  servo_body:
    label: "STS3215 servo body — COTS"
    description: "Visual stand-in, 18 per robot."
  yaw_bearing_upper:
    label: "Bottom yaw 6805 — COTS, tower-seated (cap deleted)"
    description: >-
      The single bottom bearing per leg, seated in chassis_bottom's own
      open-top phi 37.15 pocket at the production LOWER-race position
      (coxa-local z 0.5..7.5; the mesh is the production upper-race
      model instanced 7 mm down).  Inner race pressed on the hub boss
      against the coxa's phi 29 seat ring; outer race radially housed
      by the pocket's 4 mm band and seated on the z 0.5 shoulder.  The
      production yaw_bearing_cap that used to house it is deleted in
      this variant.
  tibia_tube:
    label: "Phi 8 carbon tibia tube — COTS"
    description: "Unchanged production part."
