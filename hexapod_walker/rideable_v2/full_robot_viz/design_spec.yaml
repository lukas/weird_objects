notes:
  - "Belt runs are NOT modelled in the scene (same convention as v1's chain):
    a belt spans a declared joint, so modelling it would fail the
    joint-articulation checks it is exempt from in reality."
  - "No rider until the machine has survived substantial ballast testing —
    see README.md §9 for the staged ballast protocol."
  - "AK80-64 specs/prices live-verified Aug 2026 (store.cubemars.com);
    AKH70-48 alternative verified same day; Gates 8MGT stock lengths/widths
    and Table 11 tension constants verified against the Poly Chain GT Carbon
    Drive Design Manual (17595_2012)."
